spring:
  application:
    name: school-management
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/schoolmanagement}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    
    # HikariCP Configuration - Fix connection pool exhaustion
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}          # Maximum number of connections in the pool
      minimum-idle: ${HIKARI_MIN_IDLE:5}                      # Minimum number of idle connections
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}  # 30 seconds - Max wait for connection
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}             # 10 minutes - Max idle time before removal
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}            # 30 minutes - Max connection lifetime
      connection-test-query: SELECT 1                         # Test query to validate connections
      pool-name: SchoolManagementHikariPool
      auto-commit: true
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:60000} # 60 seconds - Detect connection leaks
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Connection release mode - Release connections immediately after use
        connection.release_mode: after_transaction
        # Enable query cache
        query.plan_cache_max_size: 2048
        query.plan_parameter_metadata_max_size: 128
    
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

# MinIO Configuration
minio:
  url: ${MINIO_URL:http://minio:9000}  # Internal Docker network URL
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:school-management}

# Application Configuration
app:
  base-url: ${APP_BASE_URL:http://57.129.110.129:8080}  # Public URL for file download links

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-very-secure-secret-key-change-this-in-production-minimum-512-bits}
  expiration: ${JWT_EXPIRATION:86400000}

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Logging
logging:
  level:
    root: INFO
    com.schoolmanagement: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
