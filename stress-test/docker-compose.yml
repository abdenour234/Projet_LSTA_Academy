version: '3.8'

services:
  # Master node for coordinating the test
  locust-master:
    build: .
    container_name: lsta-stress-master
    ports:
      - "8089:8089"  # Web UI
    environment:
      - LOCUST_MODE=master
      - LOCUST_EXPECT_WORKERS=4
    command: >
      locust
      -f /app/locustfile.py
      --master
      --host=http://57.129.110.129
      --web-port=8089
      --expect-workers=4
    networks:
      - stress-test-network

  # Worker nodes for generating load
  locust-worker-1:
    build: .
    container_name: lsta-stress-worker-1
    environment:
      - LOCUST_MODE=worker
      - LOCUST_MASTER_NODE_HOST=locust-master
    command: >
      locust
      -f /app/locustfile.py
      --worker
      --master-host=locust-master
    depends_on:
      - locust-master
    networks:
      - stress-test-network

  locust-worker-2:
    build: .
    container_name: lsta-stress-worker-2
    environment:
      - LOCUST_MODE=worker
      - LOCUST_MASTER_NODE_HOST=locust-master
    command: >
      locust
      -f /app/locustfile.py
      --worker
      --master-host=locust-master
    depends_on:
      - locust-master
    networks:
      - stress-test-network

  locust-worker-3:
    build: .
    container_name: lsta-stress-worker-3
    environment:
      - LOCUST_MODE=worker
      - LOCUST_MASTER_NODE_HOST=locust-master
    command: >
      locust
      -f /app/locustfile.py
      --worker
      --master-host=locust-master
    depends_on:
      - locust-master
    networks:
      - stress-test-network

  locust-worker-4:
    build: .
    container_name: lsta-stress-worker-4
    environment:
      - LOCUST_MODE=worker
      - LOCUST_MASTER_NODE_HOST=locust-master
    command: >
      locust
      -f /app/locustfile.py
      --worker
      --master-host=locust-master
    depends_on:
      - locust-master
    networks:
      - stress-test-network

networks:
  stress-test-network:
    driver: bridge
