name: Deploy to VPS

on:
  push:
    branches:
      - test_prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "🚀 Starting deployment..."

            cd /home/debian/LSTA_Academy/Projet_LSTA_Academy || { echo "❌ Project directory not found"; exit 1; }

            echo "📦 Pulling latest changes from test_prod..."
            git fetch origin test_prod
            git reset --hard origin/test_prod

            echo "🛑 Stopping current containers..."
            docker compose down

            echo "🏗️ Building updated images (with cache)..."
            docker compose build

            echo "🚀 Starting containers..."
            docker compose up -d --remove-orphans

            echo "🧹 Cleaning unused Docker cache..."
            docker builder prune -af
            docker system prune -af

            echo "🧹 Cleaning old logs (system logs)..."
            journalctl --vacuum-size=200M

            echo "📊 Disk usage:"
            df -h

            echo "📦 Docker usage:"
            docker system df

            echo "✅ Deployment completed successfully!"
