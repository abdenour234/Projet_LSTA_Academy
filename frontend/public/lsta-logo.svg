<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Fond circulaire bleu -->
  <circle cx="100" cy="100" r="95" fill="#2563EB"/>
  
  <!-- Cercle intérieur blanc -->
  <circle cx="100" cy="100" r="85" fill="white"/>
  
  <!-- Cercle de bordure bleue -->
  <circle cx="100" cy="100" r="75" fill="#2563EB"/>
  
  <!-- Texte L.S.T.A. en blanc -->
  <text x="100" y="90" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">L.S.T.A.</text>
  
  <!-- Texte ACADEMY en blanc plus petit -->
  <text x="100" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle" letter-spacing="2">ACADEMY</text>
  
  <!-- Étoile décorative en haut -->
  <polygon points="100,30 104,42 116,44 108,52 110,64 100,58 90,64 92,52 84,44 96,42" fill="#FCD34D"/>
  
  <!-- Livre ouvert en bas -->
  <path d="M 70 140 Q 100 135 130 140 L 130 160 Q 100 155 70 160 Z" fill="#FCD34D" opacity="0.9"/>
  <line x1="100" y1="135" x2="100" y2="160" stroke="white" stroke-width="2"/>
</svg>
