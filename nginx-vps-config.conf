# Configuration Nginx pour VPS - À installer dans /etc/nginx/sites-available/pedagoria
# Installation:
# 1. sudo nano /etc/nginx/sites-available/pedagoria
# 2. Copier ce contenu
# 3. sudo ln -s /etc/nginx/sites-available/pedagoria /etc/nginx/sites-enabled/
# 4. sudo nginx -t
# 5. sudo systemctl reload nginx

# HTTP - Redirection vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pedagoria.com www.pedagoria.com;
    
    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - Configuration principale
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pedagoria.com www.pedagoria.com;

    # SSL Certificate (sera généré par certbot)
    ssl_certificate /etc/letsencrypt/live/pedagoria.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pedagoria.com/privkey.pem;
    
    # SSL Configuration moderne
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs
    access_log /var/log/nginx/pedagoria-access.log;
    error_log /var/log/nginx/pedagoria-error.log;

    # Limite de taille pour upload de fichiers
    client_max_body_size 100M;

    # Frontend - Proxy vers le conteneur Docker sur port 8081
    location / {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend API - Déjà proxié par le conteneur frontend
    # Pas besoin de configuration supplémentaire car /api est géré par le conteneur frontend
}
