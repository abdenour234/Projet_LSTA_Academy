# Test Database Configuration - H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway/Liquibase for tests
spring.flyway.enabled=false
spring.liquibase.enabled=false

# JWT Configuration (test values)
jwt.secret=testSecretKeyForJWTTokenGenerationInTestEnvironmentOnly1234567890
jwt.expiration=3600000

# MinIO Configuration (test values - not used in RBAC tests)
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=test-bucket

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.schoolmanagement=DEBUG
